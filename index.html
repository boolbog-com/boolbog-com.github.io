<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>boolbog</title>
<meta name="description" content="Directory of boolbog pages.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233fc7eb'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
<link rel="stylesheet" href="assets/theme.css">
<style>
  main { max-width: 640px; margin: 0 auto; padding: 72px 16px 64px; }
  .site {
    margin: 0 0 8px;
    font-size: clamp(48px, 13vw, 88px);
    line-height: .95;
    font-weight: 820;
    font-stretch: 151%;
    font-variation-settings: "wdth" 151;
    letter-spacing: -.02em;
    color: var(--on-surface);
  }
  .site::after {
    content: "";
    display: inline-block;
    width: .2em; height: .2em;
    margin-left: .06em;
    border-radius: 50%;
    background: var(--primary);
  }
  .lede { margin: 0 0 40px; color: var(--on-surface-variant); font-size: 16px; }

  .pages { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .page {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 16px 16px 16px;
    border-radius: var(--radius-l);
    background: var(--surface-low);
    color: inherit; text-decoration: none;
    transition: background-color .15s;
  }
  .page:hover { background: var(--surface-container); }
  .page:active { background: var(--surface-high); }
  .avatar {
    width: 48px; height: 48px; flex: none;
    display: grid; place-items: center;
    border-radius: var(--radius-m);
    background: var(--primary-container);
    color: var(--on-primary-container);
    font-weight: 700; font-size: 20px;
    font-variation-settings: "wdth" 130;
  }
  .text { min-width: 0; flex: 1; }
  .name { display: block; font-size: 17px; font-weight: 600; }
  .desc { display: block; color: var(--on-surface-variant); font-size: 14px; }
  .path { display: block; margin-top: 2px; color: var(--primary-ink); font-size: 13px; }
  .chev { color: var(--on-surface-variant); }
  .avatar .icon { width: 24px; height: 24px; }
  .avatar.alt { background: var(--secondary-container); color: var(--on-secondary-container); }

  /* Split card: one entry, two links. Connected halves with a small gap and tight
     inner corners, like an M3 split button. Stacks on narrow screens. */
  .split { display: flex; gap: 2px; }
  .split .page:first-child { flex: 1; min-width: 0; border-radius: var(--radius-l) 4px 4px var(--radius-l); }
  .split .page:last-child { flex: none; border-radius: 4px var(--radius-l) var(--radius-l) 4px; }
  @media (max-width: 480px) {
    .split { flex-direction: column; }
    .split .page:first-child { border-radius: var(--radius-l) var(--radius-l) 4px 4px; }
    .split .page:last-child { border-radius: 4px 4px var(--radius-l) var(--radius-l); }
  }
</style>
</head>
<body>
<main>
  <h1 class="site">boolbog</h1>
  <p class="lede">Pages on this site.</p>

  <ul class="pages">
    <li>
      <a class="page" href="ulatek/">
        <span class="avatar" aria-hidden="true">U</span>
        <span class="text">
          <span class="name">Ulatek</span>
          <span class="desc">Encounter VODs you can filter by boss side, wave side, strategy and pickup side.</span>
          <span class="path">/ulatek</span>
        </span>
        <svg class="icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 16.6 13.2 12 8.6 7.4 10 6l6 6-6 6z"/></svg>
      </a>
    </li>
    <li class="split">
      <a class="page" href="https://addons.wago.io/addons/rcpt-addon" target="_blank" rel="noopener">
        <span class="avatar" aria-hidden="true">R</span>
        <span class="text">
          <span class="name">RCPT Addon</span>
          <span class="desc">Ready Check Pull Timer for World of Warcraft.</span>
          <span class="path">Wago</span>
        </span>
        <svg class="icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21q-.82 0-1.41-.59Q3 19.82 3 19V5q0-.82.59-1.41Q4.18 3 5 3h7v2H5v14h14v-7h2v7q0 .82-.59 1.41Q19.82 21 19 21zm4.7-5.3-1.4-1.4L17.6 5H14V3h7v7h-2V6.4z"/></svg>
      </a>
      <a class="page" href="https://github.com/spencerneutron/RCPT-Addon" target="_blank" rel="noopener" aria-label="RCPT Addon source on GitHub">
        <span class="avatar alt" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M8 18 2 12l6-6 1.4 1.45L4.85 12l4.55 4.55zm8 0-1.4-1.45L19.15 12 14.6 7.4 16 6l6 6z"/></svg></span>
        <span class="text">
          <span class="name">Source</span>
          <span class="path">GitHub</span>
        </span>
        <svg class="icon chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21q-.82 0-1.41-.59Q3 19.82 3 19V5q0-.82.59-1.41Q4.18 3 5 3h7v2H5v14h14v-7h2v7q0 .82-.59 1.41Q19.82 21 19 21zm4.7-5.3-1.4-1.4L17.6 5H14V3h7v7h-2V6.4z"/></svg>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
